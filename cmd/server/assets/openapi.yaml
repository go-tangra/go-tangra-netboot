                    type: array
                    items:
                        $ref: '#/components/schemas/UnknownBoot'
                meta:
                    $ref: '#/components/schemas/PageMeta'
        Machine:
            type: object
            properties:
                id:
                    type: string
                mac:
                    type: string
                name:
                    type: string
                firmware:
                    enum:
                        - FIRMWARE_UNSPECIFIED
                        - FIRMWARE_BIOS
                        - FIRMWARE_UEFI_X64
                        - FIRMWARE_UNKNOWN
                    type: string
                    format: enum
                profileId:
                    type: string
                reservationIp:
                    type: string
                provisionState:
                    enum:
                        - PROVISION_STATE_UNSPECIFIED
                        - PROVISION_STATE_NEW
                        - PROVISION_STATE_READY
                        - PROVISION_STATE_INSTALLING
                        - PROVISION_STATE_INSTALLED
                        - PROVISION_STATE_FAILED
                    type: string
                    format: enum
                notes:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                activeSessionId:
                    type: string
                networkConfig:
                    type: string
                    description: JSON netplan override; empty means "use the profile's".
                installNetwork:
                    $ref: '#/components/schemas/InstallNetwork'
            description: Machine is a netboot target registered on the upstream netbootd.
        PageMeta:
            type: object
            properties:
                total:
                    type: string
                page:
                    type: integer
                    format: int32
                pageSize:
                    type: integer
                    format: int32
            description: Pagination metadata echoed back by every list RPC.
        PreviewProfileRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                machineId:
                    type: string
                    description: Optional; a fixture machine is used when empty.
        PreviewProfileResponse:
            type: object
            properties:
                userData:
                    type: string
                    description: Rendered autoinstall YAML with credentials already redacted upstream.
                cmdline:
                    type: string
        Profile:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                version:
                    type: integer
                    format: int32
                ubuntuRelease:
                    type: string
                storageLayout:
                    type: string
                    description: 'JSON: {mode: lvm|direct|custom, custom: ...}'
                networkConfig:
                    type: string
                    description: JSON, netplan-shaped.
                packages:
                    type: array
                    items:
                        type: string
                sshAuthorizedKeys:
                    type: array
                    items:
                        type: string
                userDataTemplate:
                    type: string
                lateCommands:
                    type: array
                    items:
                        type: string
                kernelCmdlineExtra:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
                assignedMachines:
                    type: string
                keyboardLayout:
                    type: string
                keyboardVariant:
                    type: string
                locale:
                    type: string
                timezone:
                    type: string
                installUsername:
                    type: string
                hasPassword:
                    type: boolean
                    description: Whether a login password is set. The hash is never returned.
                defaultDns:
                    type: array
                    items:
                        type: string
            description: |-
                Profile is an installation profile. The login password is never carried on
                 this message - only has_password reports whether one is set.
        ProfileInput:
            required:
                - name
                - ubuntuRelease
            type: object
            properties:
                name:
                    type: string
                ubuntuRelease:
                    type: string
                storageLayout:
                    type: string
                networkConfig:
                    type: string
                packages:
                    type: array
                    items:
                        type: string
                sshAuthorizedKeys:
                    type: array
                    items:
                        type: string
                userDataTemplate:
                    type: string
                lateCommands:
                    type: array
                    items:
                        type: string
                kernelCmdlineExtra:
                    type: string
                keyboardLayout:
                    type: string
                keyboardVariant:
                    type: string
                locale:
                    type: string
                timezone:
                    type: string
                installUsername:
                    type: string
                password:
                    type: string
                    description: |-
                        Plaintext login password. Hashed (sha512-crypt) by the upstream and never
                         stored or returned in the clear. Empty on update keeps the existing
                         password; set clear_password to remove it. Redacted from every log and
                         audit record.
                clearPassword:
                    type: boolean
                defaultDns:
                    type: array
                    items:
                        type: string
            description: ProfileInput is the mutable body of a profile.
        ProvisionMachineRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
        ProvisionMachineResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
        ProvisioningEvent:
            type: object
            properties:
                time:
                    type: string
                    format: date-time
                sessionId:
                    type: string
                machineMac:
                    type: string
                phase:
                    type: string
                outcome:
                    enum:
                        - EVENT_OUTCOME_UNSPECIFIED
                        - EVENT_OUTCOME_OK
                        - EVENT_OUTCOME_ERROR
                        - EVENT_OUTCOME_DENIED
                    type: string
                    format: enum
                detail:
                    type: string
                    description: Opaque JSON detail as recorded upstream.
        ProvisioningSession:
            type: object
            properties:
                id:
                    type: string
                machineId:
                    type: string
                machineName:
                    type: string
                machineMac:
                    type: string
                profileId:
                    type: string
                profileVersion:
                    type: integer
                    format: int32
                state:
                    enum:
                        - SESSION_STATE_UNSPECIFIED
                        - SESSION_STATE_ACTIVE
                        - SESSION_STATE_COMPLETED
                        - SESSION_STATE_FAILED
                        - SESSION_STATE_STALE
                    type: string
                    format: enum
                startedAt:
                    type: string
                    format: date-time
                endedAt:
                    type: string
                    format: date-time
                failurePhase:
                    type: string
        RegisterUnknownMachineRequest:
            required:
                - mac
                - name
            type: object
            properties:
                mac:
                    type: string
                name:
                    type: string
                profileId:
                    type: string
        RegisterUnknownMachineResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
        Transfer:
            type: object
            properties:
                time:
                    type: string
                    format: date-time
                clientIp:
                    type: string
                filename:
                    type: string
                bytesSent:
                    type: string
                success:
                    type: boolean
                error:
                    type: string
                protocol:
                    enum:
                        - TRANSFER_PROTOCOL_UNSPECIFIED
                        - TRANSFER_PROTOCOL_TFTP
                        - TRANSFER_PROTOCOL_HTTP
                    type: string
                    format: enum
        UnknownBoot:
            type: object
            properties:
                mac:
                    type: string
                lastSeen:
                    type: string
                    format: date-time
                attempts:
                    type: string
            description: UnknownBoot is a MAC that requested boot but is not registered.
        UpdateDhcpConfigRequest:
            type: object
            properties:
                leaseTtlSeconds:
                    type: integer
                    description: Lease lifetime; bounded to sane values (1 minute .. 7 days).
                    format: int32
                subnets:
                    type: array
                    items:
                        $ref: '#/components/schemas/DhcpSubnet'
        UpdateDhcpConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/DhcpConfig'
        UpdateMachineRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                profileId:
                    type: string
                reservationIp:
                    type: string
                notes:
                    type: string
                networkConfig:
                    type: string
                    description: Empty string clears the override.
                installNetwork:
                    allOf:
                        - $ref: '#/components/schemas/InstallNetwork'
                    description: |-
                        Set to replace the production network; an InstallNetwork with an empty
                         address clears it.
        UpdateMachineResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
        UpdateProfileRequest:
            required:
                - id
                - profile
            type: object
            properties:
                id:
                    type: string
                profile:
                    $ref: '#/components/schemas/ProfileInput'
        UpdateProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
tags:
    - name: NetbootArtifactService
      description: |-
        Artifact Service - boot artifacts (kernels, initrds, iPXE binaries) and the
         transfer log of the TFTP/HTTP boot path.

         Upload and replace are multipart HTTP endpoints on the upstream and are
         deliberately not proxied: streaming multi-hundred-megabyte kernels through
         the admin gateway would put unbounded memory pressure on this module.
         Operators upload artifacts directly to the netbootd host.
    - name: NetbootDhcpService
      description: |-
        DHCP Service - the authoritative DHCP configuration of the upstream
         netbootd, its active leases, and any foreign DHCP servers it has observed
         on the provisioning segment.
    - name: NetbootMachineService
      description: |-
        Machine Service - manages netboot target machines on the upstream netbootd
         instance. Every RPC is a thin, authorized, validated proxy: this module
         owns no machine state of its own.
    - name: NetbootProfileService
      description: Profile Service - installation profiles (autoinstall seed templates).
    - name: NetbootSessionService
      description: |-
        Session Service - provisioning sessions and their event timelines.

         The upstream also exposes a server-sent-events stream at
         GET /api/v1/events/stream. It is not expressible as a unary RPC and is not
         proxied: the operator UI polls ListSessions instead, which keeps the
         module stateless and avoids holding long-lived upstream connections open
         on behalf of browser clients.
    - name: NetbootSystemService
      description: |-
        System Service - health, build info, upstream connectivity and the
         aggregate counters that back the Vben admin dashboard widgets.
