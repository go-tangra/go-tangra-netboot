                        - ARTIFACT_KIND_OTHER
                    type: string
                    format: enum
                ubuntuRelease:
                    type: string
                filename:
                    type: string
                sizeBytes:
                    type: string
                sha256:
                    type: string
                uploadedBy:
                    type: string
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
        CancelProvisionRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
        CancelProvisionResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
        CheckUpstreamResponse:
            type: object
            properties:
                connected:
                    type: boolean
                endpoint:
                    type: string
                    description: |-
                        Scheme + host of the configured netbootd instance. Never carries
                         credentials, and is only exposed to authorized operators.
                tls:
                    type: boolean
                    description: Whether the transport to the upstream is TLS-protected.
                authenticated:
                    type: boolean
                    description: Whether an operator session is currently established.
                latencyMs:
                    type: string
                message:
                    type: string
        CloneProfileRequest:
            required:
                - id
                - newName
            type: object
            properties:
                id:
                    type: string
                newName:
                    type: string
        CloneProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
        ComponentHealth:
            type: object
            properties:
                status:
                    enum:
                        - HEALTH_STATUS_UNSPECIFIED
                        - HEALTH_STATUS_HEALTHY
                        - HEALTH_STATUS_DEGRADED
                        - HEALTH_STATUS_UNHEALTHY
                    type: string
                    format: enum
                message:
                    type: string
        CreateMachineRequest:
            required:
                - mac
                - name
            type: object
            properties:
                mac:
                    type: string
                    description: Colon- or hyphen-separated 48-bit MAC address.
                name:
                    type: string
                firmware:
                    enum:
                        - FIRMWARE_UNSPECIFIED
                        - FIRMWARE_BIOS
                        - FIRMWARE_UEFI_X64
                        - FIRMWARE_UNKNOWN
                    type: string
                    format: enum
                profileId:
                    type: string
                reservationIp:
                    type: string
                notes:
                    type: string
                networkConfig:
                    type: string
                    description: JSON netplan override; empty means "use the profile's".
                installNetwork:
                    $ref: '#/components/schemas/InstallNetwork'
        CreateMachineResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
        CreateProfileRequest:
            required:
                - profile
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/ProfileInput'
        CreateProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
        DhcpConfig:
            type: object
            properties:
                enabled:
                    type: boolean
                version:
                    type: integer
                    format: int32
                leaseTtlSeconds:
                    type: integer
                    format: int32
                subnets:
                    type: array
                    items:
                        $ref: '#/components/schemas/DhcpSubnet'
                updateTime:
                    type: string
                    format: date-time
        DhcpSubnet:
            required:
                - network
                - rangeStart
                - rangeEnd
            type: object
            properties:
                id:
                    type: string
                network:
                    type: string
                    description: Network in CIDR form, e.g. 10.10.0.0/24.
                rangeStart:
                    type: string
                rangeEnd:
                    type: string
                gateway:
                    type: string
                dns:
                    type: array
                    items:
                        type: string
        DisableDhcpRequest:
            type: object
            properties: {}
        DisableDhcpResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/DhcpConfig'
        EnableDhcpRequest:
            type: object
            properties: {}
        EnableDhcpResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/DhcpConfig'
        ForeignServer:
            type: object
            properties:
                serverId:
                    type: string
                lastSeen:
                    type: string
                    format: date-time
                offersSeen:
                    type: string
            description: ForeignServer is a rogue/unexpected DHCP server seen on the segment.
        GetArtifactResponse:
            type: object
            properties:
                artifact:
                    $ref: '#/components/schemas/BootArtifact'
        GetDhcpConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/DhcpConfig'
        GetInfoResponse:
            type: object
            properties:
                version:
                    type: string
                buildTime:
                    type: string
                goVersion:
                    type: string
                gitCommit:
                    type: string
        GetMachineResponse:
            type: object
            properties:
                machine:
                    $ref: '#/components/schemas/Machine'
        GetProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
        GetSessionResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/ProvisioningSession'
                timeline:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProvisioningEvent'
                evidence:
                    type: string
                    description: Opaque JSON evidence bundle as recorded upstream.
        GetStatsResponse:
            type: object
            properties:
                totalMachines:
                    type: string
                installingMachines:
                    type: string
                installedMachines:
                    type: string
                failedMachines:
                    type: string
                totalProfiles:
                    type: string
                activeSessions:
                    type: string
                unknownBoots:
                    type: string
                activeLeases:
                    type: string
                dhcpEnabled:
                    type: boolean
        HealthResponse:
            type: object
            properties:
                status:
                    enum:
                        - HEALTH_STATUS_UNSPECIFIED
                        - HEALTH_STATUS_HEALTHY
                        - HEALTH_STATUS_DEGRADED
                        - HEALTH_STATUS_UNHEALTHY
                    type: string
                    format: enum
                message:
                    type: string
                components:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/ComponentHealth'
        InstallNetwork:
            type: object
            properties:
                address:
                    type: string
                    description: Production IP in CIDR form, e.g. 10.0.0.10/24.
                gateway:
                    type: string
                    description: Default route next hop.
                dns:
                    type: array
                    items:
                        type: string
                    description: Nameservers; empty inherits the profile default.
            description: |-
                InstallNetwork is the "production network" of the two-NIC netboot pattern:
                 the production NIC receives this static configuration (and owns the only
                 default route) while the provisioning NIC is torn down after install.
        Lease:
            type: object
            properties:
                ip:
                    type: string
                mac:
                    type: string
                machineId:
                    type: string
                machineName:
                    type: string
                expiresAt:
                    type: string
                    format: date-time
        ListArtifactsResponse:
            type: object
            properties:
                artifacts:
                    type: array
                    items:
                        $ref: '#/components/schemas/BootArtifact'
                meta:
                    $ref: '#/components/schemas/PageMeta'
        ListForeignServersResponse:
